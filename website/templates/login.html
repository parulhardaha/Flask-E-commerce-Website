{% extends 'forms.html' %}

{% block title %} Login {% endblock %}

{% block body %}
<section class="login-page"> <!-- Add this class -->
    <div class="base-content">
        <div class="form-container">
            <h3 class="login-title">Login to Start Shopping</h3>

            <form method="POST" class="login-form">
                {{ form.hidden_tag() }} <!-- CSRF token -->

                <div class="input-group">
                    <label>Email Address</label>
                    {{ form.email(class="input-field") }}
                </div>

                <div class="input-group">
                    <label>Password</label>
                    {{ form.password(class="input-field") }}
                </div>

                <!-- Login button centered -->
                <div class="buttons">
                    {{ form.submit(class="login-btn") }}
                </div>

                <!-- Sign up link below button -->
                <a href="{{ url_for('auth.sign_up') }}" class="signup-link">Don't have an account? Sign up</a>
            </form>
        </div>
    </div>
</section>
{% endblock %}
