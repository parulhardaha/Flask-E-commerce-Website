<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nykaa | {% block title %} {% endblock %}</title>
    
    <!-- External Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>
<body>

    <!-- Header -->
    <div class="navbar">
        <div class="logo-container">
            <img src="{{ url_for('static', filename='images/nykaa_logo.jpg') }}" alt="Nykaa Logo">
            <h1>Nykaa</h1>
        </div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">About Us</a>
            <a href="#">Contact Us</a>
            <a href="#">Cart</a>
            <a href="#">Wishlist</a>
            <a href="#">Account</a>
        </div>
    </div>

    <!-- Page Content -->
    <div class="content">
        {% block body %}{% endblock %}
    </div>

    <!-- Footer -->
    <div class="footer">
        © 2025 Nykaa | All rights reserved
    </div>

</body>
</html>
